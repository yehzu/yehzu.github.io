<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;700&display=swap" rel="stylesheet">

<style>
    :root {
        --theme: #fffdf5;
        --primary: #2c2c2c;
        --secondary: #586e75;
        --tertiary: #eee8d5;
        --content: #2c2c2c;
        --hljs-bg: #eee8d5;
        --code-bg: transparent;
        --border: #eee8d5;
        --font-family: 'Noto Serif TC', Georgia, 'Times New Roman', Times, serif;
    }

    body {
        background-color: #fffdf5 !important;
        font-family: 'Noto Serif TC', Georgia, 'Times New Roman', Times, serif !important;
        color: #2c2c2c !important;
        line-height: 1.7;
    }

    /* 標題樣式 */
    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
        color: #2c2c2c !important;
        font-family: 'Noto Serif TC', Georgia, serif !important;
    }

    /* 導航欄樣式 */
    .header nav {
        background: transparent !important;
    }

    /* 內容區域 */
    .main {
        background: transparent !important;
    }

    /* 文章列表 */
    .post-entry {
        background: transparent !important;
        border: none !important;
        border-bottom: 1px solid #eee8d5 !important;
        border-radius: 0 !important;
        margin-bottom: 2rem !important;
        padding: 1.5rem 0 !important;
    }

    .post-entry:hover {
        background: transparent !important;
        border-color: #cb4b16 !important;
    }

    /* 文章標題 */
    .entry-header h2 {
        font-size: 1.5rem !important;
        font-weight: 500 !important;
        margin-bottom: 0.5rem !important;
    }

    /* 連結樣式 */
    a {
        color: #268bd2 !important;
        text-decoration: none !important;
    }

    a:hover {
        color: #cb4b16 !important;
        text-decoration: underline !important;
    }

    /* 簡化頁面元素 */
    .footer {
        background: transparent !important;
        border-top: 1px solid #eee8d5 !important;
        color: #93a1a1 !important;
    }

    /* 移除不必要的陰影和邊框 */
    .theme-toggle,
    .lang-switch,
    .search-button {
        background: transparent !important;
        border: none !important;
        color: #2c2c2c !important;
    }

    /* 社交圖標樣式 */
    .social-icons a {
        background: transparent !important;
        color: #333333 !important;
        padding: 0 !important;
        margin-right: 15px !important;
    }

    .social-icons a:hover {
        background: transparent !important;
    }

    .social-icons a svg {
        fill: #333333 !important;
        background: transparent !important;
    }

    /* Brand Colors on Hover */
    .social-icons a[href*="github"]:hover svg {
        fill: #4078c0 !important;
    }

    .social-icons a[href*="linkedin"]:hover svg {
        fill: #0077b5 !important;
    }

    .social-icons a[href*="flickr"]:hover svg {
        fill: #ff0084 !important;
    }

    /* Homepage Content Alignment */
    .entry-content {
        font-size: inherit !important;
        color: var(--content) !important;
        line-height: 1.7 !important;
        overflow: visible !important;
        display: block !important;
        max-width: none !important;
    }

    /* Widen the main container on list pages (Homepage, Archives, etc.) 
       to accommodate the 2-column layout (250px meta + 40px gap + 610px content + 48px main padding = 948px) */
    body.list .main {
        max-width: 948px !important;
    }
</style>
