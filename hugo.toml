baseURL = "https://yehzu.github.io/"
languageCode = "zh-tw"
title = "小葉隨筆"
theme = "PaperMod"
hasCJKLanguage = true
preserveTaxonomyNames = true

[params]
    defaultTheme = "light"
    disableThemeToggle = true
    description = "There is no try."
    author = "yehzu"
    ShowReadingTime = false
    ShowShareButtons = false
    ShowPostNavLinks = false
    ShowBreadCrumbs = false
    ShowCodeCopyButtons = false
    ShowRssButtonInSectionTermList = false
    ShowToc = false
    ShowFullTextinRSS = true
    disableSpecial1stPost = true
    hidemeta = true
    hideSummary = false
    summaryLength = 1000 # Force manual summary split using <!--more-->
    showtoc = false
    tocopen = false
    comments = false
    disableScrollToTop = true
    
    [params.profileMode]
    enabled = false

    [params.cover]
    hidden = true

    [params.homeInfoParams]
        Title = "小葉隨筆"
        Content = "Do or do not. There is no try."

    [[params.socialIcons]]
        name = "github"
        url = "https://github.com/yehzu"

    [[params.socialIcons]]
        name = "linkedin"
        url = "https://www.linkedin.com/in/yehzu/"

    [[params.socialIcons]]
        name = "flickr"
        url = "https://www.flickr.com/photos/yehzu/"

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "文章"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "tags"
    name = "標籤"
    url = "/tags/"
    weight = 20
